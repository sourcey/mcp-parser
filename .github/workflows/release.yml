name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.version && format('refs/tags/v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release identity
        run: |
          node -e '
            const manifest = require("./package.json");
            if (process.env.RELEASE_TAG !== `v${manifest.version}`) {
              throw new Error(`${process.env.RELEASE_TAG} does not match ${manifest.version}`);
            }
          '
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack once
        run: |
          mkdir -p release
          npm pack --json --pack-destination release > release/pack.json
          node -e '
            const fs = require("fs");
            const record = JSON.parse(fs.readFileSync("release/pack.json", "utf8"))[0];
            fs.renameSync(`release/${record.filename}`, "release/mcp-parser.tgz");
          '
      - name: Name the publishing identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          identity="$(npm whoami)"
          echo "publishing as $identity"
          npm access list collaborators mcp-parser --json | IDENTITY="$identity" node -e '
            const collaborators = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const access = collaborators[process.env.IDENTITY];
            console.log(`mcp-parser access: ${access ?? "none"}`);
            if (access !== "read-write") process.exit(1);
          '
      - name: Publish exact npm bytes if absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "mcp-parser@$version" version >/dev/null 2>&1; then
            echo "mcp-parser@$version already exists"
          else
            npm publish ./release/mcp-parser.tgz --access public --provenance
          fi
      - name: Verify npm registry contents
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p registry assets
          # The registry can take minutes to serve a freshly published version.
          for attempt in $(seq 1 40); do
            if npm pack "mcp-parser@$version" --prefer-online --pack-destination registry >/dev/null 2>&1; then break; fi
            sleep 15
          done
          registry_tar="registry/mcp-parser-$version.tgz"
          test -f "$registry_tar"
          # Compare package contents: gzip bytes vary with the zlib of the Node that packed them.
          test "$(gunzip -c release/mcp-parser.tgz | sha256sum | cut -d' ' -f1)" = "$(gunzip -c "$registry_tar" | sha256sum | cut -d' ' -f1)"
          cp "$registry_tar" assets/mcp-parser.tgz
          (cd assets && sha256sum mcp-parser.tgz > mcp-parser.tgz.sha256)
      - name: Publish registry bytes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/mcp-parser.tgz assets/mcp-parser.tgz.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" assets/mcp-parser.tgz assets/mcp-parser.tgz.sha256 --generate-notes --verify-tag
          fi
